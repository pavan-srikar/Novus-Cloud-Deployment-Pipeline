name: Novus CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- Node ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------- Backend ----------------
      - name: Install Backend Dependencies
        working-directory: app/backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: app/backend
        run: npx prisma generate

      - name: Build Backend
        working-directory: app/backend
        run: npm run build

      # ---------------- Frontend ----------------
      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: app/frontend
        run: npm run build

      # ---------------- Docker ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- Backend Image ----------------
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novus-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/novus-backend:latest

      # ---------------- Frontend Image ----------------
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novus-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/novus-frontend:latest

      # ---------------- Update Kubernetes Manifests ----------------
      - name: Update Kubernetes image tags
        run: |
          sed -i "s|ghcr.io/${{ github.repository_owner }}/novus-backend:.*|ghcr.io/${{ github.repository_owner }}/novus-backend:${{ github.sha }}|g" infrastructure/kubernetes/backend/deployment.yaml

          sed -i "s|ghcr.io/${{ github.repository_owner }}/novus-frontend:.*|ghcr.io/${{ github.repository_owner }}/novus-frontend:${{ github.sha }}|g" infrastructure/kubernetes/frontend/deployment.yaml

      # ---------------- Commit Updated Manifests ----------------
      - name: Commit updated Kubernetes manifests to deployment branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add infrastructure/kubernetes/backend/deployment.yaml
          git add infrastructure/kubernetes/frontend/deployment.yaml

          git diff --cached --quiet && exit 0

          git commit -m "ci: update image tags [skip ci]"

          # deployment branch is bot-owned only — force push is expected here,
          # it always reflects "main + latest image tags", never manual edits
          git push origin HEAD:deployment --force

  deploy:
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Kubernetes Secret
        uses: appleboy/ssh-action@v1.2.2
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_URL,JWT_SECRET,GEMINI_API_KEY,GROQ_API_KEY,OPENROUTER_API_KEY,DEEPSEEK_API_KEY
          script: |
            cd ~/Novus-Cloud-Deployment-Pipeline
            git fetch origin
            git reset --hard origin/main
            chmod +x infrastructure/kubernetes/config/update-k8s-secret.sh
            bash infrastructure/kubernetes/config/update-k8s-secret.sh