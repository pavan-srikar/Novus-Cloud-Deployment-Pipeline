name: Novus CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------- Node ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------- Backend ----------------
      - name: Install Backend Dependencies
        working-directory: app/backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: app/backend
        run: npx prisma generate

      - name: Build Backend
        working-directory: app/backend
        run: npm run build

      # ---------------- Frontend ----------------
      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: app/frontend
        run: npm run build

      # ---------------- Docker ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- Backend Image ----------------
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novus-backend:latest

      # ---------------- Frontend Image ----------------
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novus-frontend:latest

  deploy:
    needs: build-and-verify

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            mkdir -p ~/novus

            cd ~/novus

            curl -fsSL \
            https://raw.githubusercontent.com/pavan-srikar/Novus-Cloud-Deployment-Pipeline/main/docker-compose.prod.yml \
            -o docker-compose.prod.yml

            cat > .env <<EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}

            DATABASE_URL=${{ secrets.DATABASE_URL }}

            PORT=${{ secrets.PORT }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}

            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            EOF

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f