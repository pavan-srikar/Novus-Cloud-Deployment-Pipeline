name: Novus CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infrastructure/kubernetes/**'

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- Node ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------- Backend ----------------
      - name: Install Backend Dependencies
        working-directory: app/backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: app/backend
        run: npx prisma generate

      - name: Build Backend
        working-directory: app/backend
        run: npm run build

      # ---------------- Frontend ----------------
      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: app/frontend
        run: npm run build

      # ---------------- Docker ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- Backend Image ----------------
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novus-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/novus-backend:latest

      # ---------------- Frontend Image ----------------
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novus-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/novus-frontend:latest

      # ---------------- Update Kubernetes Manifests ----------------
      - name: Update Kubernetes image tags
        run: |
          sed -i "s|ghcr.io/${{ github.repository_owner }}/novus-backend:.*|ghcr.io/${{ github.repository_owner }}/novus-backend:${{ github.sha }}|g" infrastructure/kubernetes/backend/deployment.yaml

          sed -i "s|ghcr.io/${{ github.repository_owner }}/novus-frontend:.*|ghcr.io/${{ github.repository_owner }}/novus-frontend:${{ github.sha }}|g" infrastructure/kubernetes/frontend/deployment.yaml

      # ---------------- Commit Updated Manifests ----------------
      - name: Commit updated Kubernetes manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add infrastructure/kubernetes/backend/deployment.yaml
          git add infrastructure/kubernetes/frontend/deployment.yaml

          git diff --cached --quiet && exit 0

          git commit -m "ci: update image tags [skip ci]"

          git push origin HEAD:main

