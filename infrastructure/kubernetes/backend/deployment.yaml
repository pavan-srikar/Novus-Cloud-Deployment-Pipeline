apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: novus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"

    spec:
      containers:
      - name: backend
        image: ghcr.io/pavan-srikar/novus-backend:2eb587ba370a162d196c3fcf5d729b6ad7b3ff8d
        imagePullPolicy: Always
        ports:
        - containerPort: 5000

        envFrom:
        - secretRef:
            name: novus-secret
        - configMapRef:
            name: novus-config

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
          
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5