apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: novus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:

      - name: postgres

        image: postgres:17

        ports:

        - containerPort: 5432

        envFrom:

        - secretRef:
            name: novus-secret

        volumeMounts:

        - mountPath: /var/lib/postgresql/data
          name: postgres-storage

      volumes:

      - name: postgres-storage

        persistentVolumeClaim:
          claimName: postgres-pvc